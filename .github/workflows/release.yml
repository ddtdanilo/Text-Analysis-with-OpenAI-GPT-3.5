name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify source
        env:
          OPENAI_API_KEY: ""
        run: |
          ruff check .
          ruff format --check .
          pytest

      - name: Verify tag matches package version
        run: python -c "import os, tomllib; actual=tomllib.load(open('pyproject.toml','rb'))['project']['version']; expected=os.environ['GITHUB_REF_NAME'].removeprefix('v'); assert actual == expected, f'{actual} != {expected}'"

      - name: Build distributions
        run: python -m build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "OpenAI Document Analyzer $GITHUB_REF_NAME" --verify-tag
          fi
