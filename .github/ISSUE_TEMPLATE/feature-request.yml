name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: Privacy, security, compatibility, and cost impact
      description: Explain changes to document handling or OpenAI API usage.
    validations:
      required: true
  - type: input
    id: official-docs
    attributes:
      label: Official OpenAI documentation
      description: Required when proposing a model or API capability.
      placeholder: https://developers.openai.com/...
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This request contains no secrets or sensitive documents.
          required: true
